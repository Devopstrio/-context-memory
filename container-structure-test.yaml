schemaVersion: "2.0.0"
metadataTest:
  exposedPorts: ["8000"]
  volumes: ["/tmp", "/app/logs", "/app/data"]
  entrypoint: ["python", "-m", "uvicorn", "context_memory.main:app"]
  user: "contextmemory"

commandTests:
  - name: "Python version"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3.11"]
  - name: "Health check endpoint"
    command: "curl"
    args: ["-f", "http://localhost:8000/health/live"]
    expectedOutput: ["UP"]

fileExistenceTests:
  - name: "App directory"
    path: "/app"
    shouldExist: true
  - name: "Source code"
    path: "/app/src/context_memory/main.py"
    shouldExist: true
