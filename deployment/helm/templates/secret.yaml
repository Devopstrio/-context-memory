apiVersion: v1
kind: Secret
metadata:
  name: {{ include "context-memory.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "context-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "redisUrl is required" .Values.secrets.redisUrl | quote }}
  JWT_SECRET_KEY: {{ required "jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default "" | quote }}
