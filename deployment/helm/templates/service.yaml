apiVersion: v1
kind: Service
metadata:
  name: {{ include "context-memory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "context-memory.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.port | quote }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "context-memory.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
