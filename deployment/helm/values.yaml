replicaCount: 3

image:
  repository: ghcr.io/devopstrio/context-memory
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: context-memory.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: context-memory

config:
  environment: production
  logLevel: INFO
  databasePoolSize: "20"
  databaseMaxOverflow: "10"
  redisPoolSize: "10"
  jwtAlgorithm: HS256
  jwtIssuer: https://auth.enterprise.internal
  jwtAudience: context-memory-api
  jwtAccessTokenExpireMinutes: "30"
  otlpServiceName: context-memory
  maxMemoriesPerTenant: "100000"
  maxSessionsPerTenant: "10000"
  defaultRetentionDays: "90"
  rateLimitEnabled: "true"
  rateLimitRequestsPerMinute: "1000"

secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecretKey: ""
  encryptionKey: ""

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 2

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
